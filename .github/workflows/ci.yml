name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. No job below needs to write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Wrangler is only used for a local bundle check; keep it silent and offline.
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    name: Typecheck, corpus and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check French stemmer
        run: npm run stem:check

      # corpus.json and seed.sql are generated artefacts and are not committed.
      # Both rebuild offline from the committed data/text/, so CI reproduces the
      # exact fresh-clone path a contributor follows.
      - name: Rebuild corpus
        run: |
          npm run ingest:normalize
          npm run ingest:sql

      - name: Verify corpus invariants
        run: npm run corpus:check

      # --dry-run bundles the Worker without contacting Cloudflare, so no
      # credentials are needed and nothing is deployed.
      - name: Bundle Worker
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Report bundle size
        run: du -sh dist | cut -f1 | xargs echo "bundle:"

      # Compiling is not the same as answering. Everything above would stay green
      # on a change that breaks the MCP surface at runtime, which is how a
      # dependency bump can slip through auto-merge. The steps below drive a real
      # client session against a running Worker.
      - name: Load the local database
        run: npm run db:reset:local

      - name: Start the Worker
        run: |
          npx wrangler dev --port 8787 > /tmp/wrangler.log 2>&1 &
          for _ in $(seq 1 45); do
            curl -sf -m 2 http://localhost:8787/health >/dev/null && exit 0
            sleep 2
          done
          echo "Worker did not come up:" && cat /tmp/wrangler.log && exit 1

      - name: Smoke test the MCP surface
        run: npm run smoke

      - name: Worker logs on failure
        if: failure()
        run: cat /tmp/wrangler.log
